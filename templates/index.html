<!DOCTYPE html>
<html>
<head>
    <title>LL(1) Parser</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fa;
        }
        .container {
            margin-top: 60px;
            max-width: 700px;
        }
        .card {
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="card shadow">

        <h2 class="text-center mb-4">LL(1) Parser</h2>

        <form action="/process_page" method="POST">

            <div class="mb-3">
                <label class="form-label">Enter Grammar</label>
                <textarea name="grammar" class="form-control" rows="6"
                placeholder="Example:
E -> E + T | T
T -> T * F | F
F -> ( E ) | id"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Enter Input String</label>
                <input type="text" name="input" class="form-control"
                placeholder="id + id * id">
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Process</button>
            </div>

        </form>

    </div>
</div>

</body>
</html>
